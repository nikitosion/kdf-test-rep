name: Kotlin checks

on: [push]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Assemble
        run: bash ./gradlew assemble --no-daemon

      - name: Tests
        run: bash ./gradlew test --no-daemon
